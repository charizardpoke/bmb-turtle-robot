CMD_TOPIC=/diff_drive_controller/cmd_vel

send_cmd() {
  local duration=$1
  local linear_x=$2
  local angular_z=$3

  timeout $duration ros2 topic pub -r 10 $CMD_TOPIC geometry_msgs/msg/TwistStamped \
  "{\"header\":{\"frame_id\":\"base_footprint\"},\"twist\":{\"linear\":{\"x\":$linear_x},\"angular\":{\"z\":$angular_z}}}"
}

final_stop() {
  echo "STOPPING ROBOT"
  ros2 topic pub --once $CMD_TOPIC geometry_msgs/msg/TwistStamped \
  '{"header":{"frame_id":"base_footprint"},"twist":{"linear":{"x":0.0},"angular":{"z":0.0}}}'
}

wait_before_stage() {
  echo "Waiting 5 seconds before next stage..."
  sleep 5
}

stage_1() {
  echo "STAGE 1: Go straight for 2 seconds"
  wait_before_stage
  send_cmd 2 0.5 0.0
  final_stop
}

stage_2() {
  echo "STAGE 2: Stop for 1 second"
  send_cmd 1 0.0 0.0
}

stage_3() {
  echo "STAGE 3: Turn right 90 degrees"
  wait_before_stage
  send_cmd 3.2 0.0 -0.5
  final_stop
}

stage_4() {
  echo "STAGE 4: Go straight for 3 seconds"
  wait_before_stage
  send_cmd 3 0.01 0.0
  final_stop
}

stage_5() {
  echo "STAGE 5: Turn right 90 degrees"
  wait_before_stage
  send_cmd 3.2 0.0 -0.5
  final_stop
}

stage_6() {
  echo "STAGE 6: Go straight for 2 seconds"
  wait_before_stage
  send_cmd 2 0.01 0.0
  final_stop
}

stage_7() {
  echo "STAGE 7: Turn 180 degrees"
  wait_before_stage
  send_cmd 6.3 0.0 0.5
  final_stop
}

stage_8() {
  echo "STAGE 8: Go straight for 2 seconds"
  wait_before_stage
  send_cmd 2 0.01 0.0
  final_stop
}

stage_9() {
  echo "STAGE 9: Turn left 90 degrees"
  wait_before_stage
  send_cmd 3.2 0.0 0.5
  final_stop
}

stage_10() {
  echo "STAGE 10: Go straight for 3 seconds"
  wait_before_stage
  send_cmd 3 0.01 0.0
  final_stop
}

stage_11() {
  echo "STAGE 11: Turn left 90 degrees"
  wait_before_stage
  send_cmd 3.2 0.0 0.5
  final_stop
}

stage_12() {
  echo "STAGE 12: Go straight for 2 seconds"
  wait_before_stage
  send_cmd 2 0.01 0.0
  final_stop
}

stage_13() {
  echo "STAGE 13: Turn 180 degrees"
  wait_before_stage
  send_cmd 6.3 0.0 0.5
  final_stop
}

run_all() {
  stage_1
  stage_2
  stage_3
  stage_4
  stage_5
  stage_6
  stage_7
  stage_8
  stage_9
  stage_10
  stage_11
  stage_12
  stage_13
  final_stop
  echo "PATH COMPLETE"
}